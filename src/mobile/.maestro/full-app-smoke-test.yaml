appId: com.hisabkitab.app
name: "Full app smoke test — navigate every page without crashes"
---

# ═══════════════════════════════════════════════════════════════════════════════
# PHASE 1: Launch & handle onboarding
# ═══════════════════════════════════════════════════════════════════════════════

- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: ".*"
    timeout: 10000

# Handle Expo Dev Client launcher — tap localhost URL to load the app
- runFlow:
    when:
      visible: "Development servers"
    commands:
      - takeScreenshot: "screenshots/00-dev-client-launcher"
      - tapOn: ".*8081.*"

# Wait for the app to load — could be dev menu popup, onboarding, or login
- extendedWaitUntil:
    visible: "Continue|Skip|Use Test Account"
    timeout: 30000

# Handle Expo developer menu (first-launch popup in dev builds)
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"

# The Expo dev tools overlay may appear after connecting — dismiss it
# Tap the X dismiss button to close the sheet (works on both iOS and Android)
- runFlow:
    when:
      visible: "Go home"
    commands:
      - takeScreenshot: "screenshots/00-dev-tools-overlay"
      - tapOn:
          point: "50%,10%"

# After dismissing dev menu, wait again for actual app content
- extendedWaitUntil:
    visible: "Skip|Use Test Account"
    timeout: 30000

# Skip onboarding if shown (clearState wipes AsyncStorage)
- runFlow:
    when:
      visible: "Skip"
    commands:
      - takeScreenshot: "screenshots/00-onboarding"
      - tapOn: "Skip"

- runFlow:
    when:
      visible: "Get Started"
    commands:
      - tapOn: "Get Started"

# ═══════════════════════════════════════════════════════════════════════════════
# PHASE 2: Login screen — verify Google OAuth + Test Account
# ═══════════════════════════════════════════════════════════════════════════════

- extendedWaitUntil:
    visible: "Use Test Account"
    timeout: 30000

# Verify login page elements
- assertVisible: "HisabKitab"
- assertVisible: ".*Continue with Google.*"
- assertVisible: "Use Test Account"
- takeScreenshot: "screenshots/01-login-page"

# Login with test account
- tapOn: "Use Test Account"
- extendedWaitUntil:
    visible: "You are owed|You owe|HisabKitab"
    timeout: 20000
- takeScreenshot: "screenshots/03-login-complete"

# ═══════════════════════════════════════════════════════════════════════════════
# PHASE 3: Home Tab (Dashboard)
# ═══════════════════════════════════════════════════════════════════════════════

- assertVisible: "HisabKitab"
- assertVisible:
    text: "You are owed"
    optional: true
- assertVisible:
    text: "You owe"
    optional: true
- assertVisible:
    text: "Your Groups"
    optional: true
- assertVisible:
    text: "Recent Activity"
    optional: true
- takeScreenshot: "screenshots/04-home-tab"

# ═══════════════════════════════════════════════════════════════════════════════
# PHASE 4: Groups Tab — list, new group form
# ═══════════════════════════════════════════════════════════════════════════════

- tapOn:
    text: ".*Groups.*"
- extendedWaitUntil:
    visible: "Groups"
    timeout: 10000
- takeScreenshot: "screenshots/05-groups-list"

# ─── New Group Form — create a test group ────────────────────────────────────
- tapOn: "+ New"
- extendedWaitUntil:
    visible: "New Group"
    timeout: 5000
- assertVisible: "INR"
- assertVisible: "Create Group"
- takeScreenshot: "screenshots/06-new-group-form"

# Fill in group name and create
- tapOn: "e.g. Goa Trip 2025"
- inputText: "Smoke Test Group"
- takeScreenshot: "screenshots/06b-new-group-filled"
- tapOn: "Create Group"

# Wait for navigation back to groups list with the new group visible
- extendedWaitUntil:
    visible: "Smoke Test Group"
    timeout: 15000
- takeScreenshot: "screenshots/06c-group-created"

# ─── Open the newly created group to test group detail ───────────────────────
- tapOn: "Smoke Test Group"
- extendedWaitUntil:
    visible: "Add Expense|\\+ Add Expense|Settle"
    timeout: 10000
- takeScreenshot: "screenshots/07-group-detail"

# ─── Add Expense form (only if button is visible) ───────────────────────────
- runFlow:
    when:
      visible: "\\+ Add Expense"
    commands:
      - tapOn: "+ Add Expense"
      - extendedWaitUntil:
          visible: "Add Expense"
          timeout: 5000
      - takeScreenshot: "screenshots/08-add-expense-form"
      - back
      - extendedWaitUntil:
          visible: "Add Expense|Settle|\\+ Add Expense"
          timeout: 5000

# ─── Settle Up screen ────────────────────────────────────────────────────────
- runFlow:
    when:
      visible: "Settle"
    commands:
      - tapOn: "Settle"
      - extendedWaitUntil:
          visible: "Settle Up|Mark as paid|All settled|No balances"
          timeout: 10000
      - takeScreenshot: "screenshots/09-settle-up"
      - back
      - extendedWaitUntil:
          visible: "Add Expense|Settle|\\+ Add Expense"
          timeout: 5000

# Back to groups list
- back
- extendedWaitUntil:
    visible: "Groups"
    timeout: 5000

# ═══════════════════════════════════════════════════════════════════════════════
# PHASE 5: Activity Tab
# ═══════════════════════════════════════════════════════════════════════════════

- tapOn: "Activity"
- extendedWaitUntil:
    visible: "Activity"
    timeout: 10000
- takeScreenshot: "screenshots/12-activity-tab"

# ═══════════════════════════════════════════════════════════════════════════════
# PHASE 6: Profile Tab — verify all sections
# ═══════════════════════════════════════════════════════════════════════════════

- tapOn: "Profile"
- extendedWaitUntil:
    visible: "Profile"
    timeout: 10000
- assertVisible: "Name"
- assertVisible: "UPI ID"
- assertVisible: "Default Currency"
- assertVisible: "Appearance"
- assertVisible: "Sign Out"
- takeScreenshot: "screenshots/13-profile-tab"

# ═══════════════════════════════════════════════════════════════════════════════
# PHASE 7: Full tab round-trip (stability check)
# ═══════════════════════════════════════════════════════════════════════════════

- tapOn: "Home"
- extendedWaitUntil:
    visible: "HisabKitab"
    timeout: 5000
- tapOn: "Groups"
- extendedWaitUntil:
    visible: "Groups"
    timeout: 5000
- tapOn: "Activity"
- extendedWaitUntil:
    visible: "Activity"
    timeout: 5000
- tapOn: "Profile"
- extendedWaitUntil:
    visible: "Profile"
    timeout: 5000
- tapOn: "Home"
- extendedWaitUntil:
    visible: "HisabKitab"
    timeout: 5000
- takeScreenshot: "screenshots/14-final-round-trip"
